<style>
:root{
  --void:#02060a;
  --ink:#ece9db;
  --dim:rgba(236,233,219,.38);
  --dim2:rgba(236,233,219,.16);
  --gold:#c19b6a;
  --serif:"Dream Serif","Songti SC","STSong","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"Helvetica Neue",Inter,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{
  height:100%; width:100%; overflow:hidden;
  background:var(--void); color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
body{ cursor:default; }
body.hidecursor{ cursor:none; }

#dream{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

/* ---------- 光晕帘 ---------- */
#veil{
  position:fixed; inset:0; pointer-events:none; z-index:2;
  background:
    radial-gradient(126% 92% at 50% 45%, rgba(0,0,0,0) 46%, rgba(1,4,6,.46) 100%),
    linear-gradient(to bottom, rgba(1,4,6,.30) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 82%, rgba(1,4,6,.34) 100%);
}

/* ---------- 题跋 ---------- */
#acts{ position:fixed; inset:0; z-index:3; pointer-events:none; }
.act{ position:absolute; inset:0; opacity:0; will-change:opacity; }
.verse{
  position:absolute;
  right:clamp(20px, 5.4vw, 96px);
  top:clamp(38px, 10.5vh, 130px);
  display:flex; flex-direction:row-reverse; gap:1.42em;
  user-select:none;
}
.verse p{
  writing-mode:vertical-rl; text-orientation:upright;
  font-size:clamp(13px, .70vw + 6.4px, 19px);
  font-weight:300; letter-spacing:.40em; line-height:1.16;
  color:rgba(236,233,219,.80);
  text-shadow:0 0 18px rgba(150,180,175,.28), 0 0 46px rgba(120,150,150,.14);
  transition:letter-spacing .6s ease;
}

/* ---------- 章 / 幕号 ---------- */
#chapter{
  position:fixed; left:clamp(22px, 5.4vw, 96px); top:clamp(30px, 9vh, 104px);
  z-index:4; pointer-events:none;
  display:flex; flex-direction:column; gap:.62em;
  opacity:0; transition:opacity 1.6s ease;
}
#chapter .cn{
  font-size:clamp(11px, .46vw + 5px, 14px);
  letter-spacing:.44em; text-indent:.44em;
  color:rgba(236,233,219,.52);
  text-shadow:0 0 16px rgba(0,0,0,.7);
}
#chapter .en{
  font-family:var(--sans);
  font-size:8.5px; letter-spacing:.34em; text-transform:uppercase;
  color:rgba(236,233,219,.20);
}
#chapter .rule{
  width:34px; height:1px; margin-top:.3em;
  background:linear-gradient(to right, rgba(193,155,106,.62), rgba(193,155,106,0));
}

#num{
  position:fixed; right:clamp(20px, 5.4vw, 96px); bottom:clamp(58px, 6.6vh, 78px);
  z-index:4; pointer-events:none;
  font-family:var(--sans);
  display:flex; align-items:center; gap:9px;
  font-size:9.5px; letter-spacing:.26em;
  color:rgba(236,233,219,.24);
  opacity:0; transition:opacity 1.4s ease;
}
#num i{ display:block; width:1px; height:11px;
  background:linear-gradient(to bottom, rgba(193,155,106,.5), rgba(193,155,106,0)); }

/* ---------- 底部 ---------- */
#hud{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:0 clamp(20px, 5.4vw, 96px) clamp(20px, 3.6vh, 40px);
  display:flex; align-items:center; gap:clamp(12px, 2vw, 26px);
  opacity:0; transition:opacity 1.4s ease;
}
#hud.on{ opacity:1; }
#bar{ position:relative; flex:1; height:16px; display:flex; align-items:center; cursor:pointer; }
#bar .rail{ position:absolute; left:0; right:0; height:1px; background:rgba(236,233,219,.13); }
#bar .mark{ position:absolute; left:0; height:1px; width:0%;
  background:linear-gradient(to right, rgba(193,155,106,.30), rgba(236,233,219,.72)); }
#bar .dot{
  position:absolute; left:0; width:5px; height:5px; margin-left:-2.5px;

  transition:transform .3s ease;
}
#bar:hover .dot{ transform:scale(1.7); }
#bar .tick{ position:absolute; top:-3px; width:1px; height:7px; background:rgba(236,233,219,.14); }

#btn{
  flex:none; width:26px; height:26px; position:relative; cursor:pointer;
  opacity:.55; transition:opacity .35s ease;
}
#btn:hover{ opacity:.95; }
#btn .pp{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:3.5px; }
#btn .pp span{ display:block; width:1.5px; height:9px; background:rgba(236,233,219,.9); }
#btn .tri{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .3s ease;
}
#btn .tri i{
  display:block; width:0; height:0; margin-left:2px;
  border-left:8px solid rgba(236,233,219,.9);
  border-top:5.5px solid transparent; border-bottom:5.5px solid transparent;
}

#btn.paused .tri{ opacity:1; }

#snd{
  flex:none; width:22px; height:22px; cursor:pointer;
  display:flex; align-items:flex-end; justify-content:center; gap:2px;
  opacity:.34; transition:opacity .4s ease;
}
#snd:hover{ opacity:.85; }
#snd span{ display:block; width:1.5px; border-radius:1px; background:rgba(236,233,219,.92); }
#snd span:nth-child(1){ height:6px; }
#snd span:nth-child(2){ height:11px; }
#snd span:nth-child(3){ height:7px; }
#snd.on{ opacity:.72; }
#snd.on span{ animation:sndbar 1.7s ease-in-out infinite; }
#snd.on span:nth-child(2){ animation-delay:.22s; }
#snd.on span:nth-child(3){ animation-delay:.44s; }
@keyframes sndbar{ 0%,100%{ transform:scaleY(.5); } 50%{ transform:scaleY(1.3); } }

#tc{
  flex:none; font-family:var(--sans);
  font-size:9.5px; letter-spacing:.16em; font-variant-numeric:tabular-nums;
  color:rgba(236,233,219,.30);
}

/* ---------- 片头 ---------- */
#intro{
  position:fixed; inset:0; z-index:8;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
#intro .wrap{
  display:flex; flex-direction:row-reverse; gap:2.6em;
  opacity:0; transform:translateY(10px);
  transition:opacity 2.6s ease, transform 2.6s ease;
}
#intro.show .wrap{ opacity:1; transform:translateY(0); }
#intro .t{
  writing-mode:vertical-rl; text-orientation:upright;
  font-size:clamp(24px, 3.4vw, 46px);
  font-weight:300; letter-spacing:.52em;
  color:rgba(236,233,219,.93);
  text-shadow:0 0 34px rgba(140,175,170,.36), 0 0 80px rgba(110,145,150,.18);
}

  writing-mode:vertical-rl; text-orientation:upright;

  font-size:clamp(9px, .5vw + 5px, 12px);

  color:rgba(236,233,219,.34);

}

/* ---------- 片尾 ---------- */
#outro{
  position:fixed; inset:0; z-index:8;

}

}
#outro .seal{
  width:44px; height:44px; border:1px solid rgba(178,62,48,.62);

}

/* ---------- 载入 ---------- */
#boot{

  display:flex; align-items:center; justify-content:center;
  transition:opacity 1.8s ease;
}

#boot .d{
  width:3px; height:3px; border-radius:50%;
  background:rgba(236,233,219,.5);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ opacity:.12; transform:scale(.7);} 50%{ opacity:.7; transform:scale(1.5);} }

body.shot #boot{ display:none; }
body.bare #hud, body.bare #chapter, body.bare #num, body.bare #veil, body.bare #acts{ display:none !important; }
body.shot #intro, body.shot #outro{ display:none; }

body.nogl #dream{ display:none; }
body.nogl{ background:radial-gradient(120% 80% at 50% 30%, #0d1a20 0%, #050a0e 60%, #010305 100%); }

/* 竖屏手机：题跋缩小，收进顶部 */

  .verse{ right:auto; left:50%; transform:translateX(-50%); top:clamp(28px,6vh,64px); }
  #chapter{ top:auto; bottom:clamp(96px, 15vh, 150px); }
}

  </div>

  <div class="seal">梦</div>

</div>

<div id="boot"><div class="d"></div></div>

<audio id="bgm" loop preload="none" src="bgm.mp3" style="display:none"></audio>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_time;

/* ---- 相机 ---- */
uniform float u_camX;
uniform float u_horizon;
uniform float u_zoom;
uniform float u_rain;     /* 雨量 */
uniform float u_wind;     /* 风：-1 到 1，带阵性 */
uniform float u_pan;      /* 镜头水平摇移：整个视角一起动 */
uniform float u_roll;     /* 极轻的画面倾斜，像手持 */

/* ---- 天光 ---- */
uniform vec3  u_skyZen;
uniform vec3  u_skyMid;
uniform vec3  u_skyHor;
uniform vec3  u_sunCol;
uniform float u_sunI;
uniform vec3  u_ambCol;
uniform float u_amb;
uniform vec4  u_sun;      /* x, y, alt, r */
uniform vec4  u_moon;     /* x, y, alt, r */
uniform float u_moonI;
uniform float u_star;

/* ---- 天气 ---- */
uniform float u_cloud;
uniform float u_fog;
uniform float u_fogY;

/* ---- 山 ---- */
uniform vec3  u_fogCol;
uniform vec3  u_mtnCol;
uniform float u_mtnAmp;
uniform float u_mtnLift;

/* ---- 水 ---- */
uniform float u_water;
uniform float u_waterY;

/* ---- 外物 ---- */
uniform float u_prop;
uniform vec2  u_propPos;
uniform float u_propS;
uniform float u_propA;

/* ---- 转场 / 后期 ---- */
uniform float u_mist;
uniform vec3  u_mistCol;
uniform float u_vign;
uniform float u_fade;

const float PI  = 3.14159265359;
const float TAU = 6.28318530718;

/* ================= 基础 ================= */
float hash21(vec2 p){
  p = fract(p * vec2(233.34, 851.73));
  p += dot(p, p + 23.45);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
             mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
}
const mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);

float fbm(vec2 p, int oct){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 6; i++){
    if(i >= oct) break;
    v += a * vnoise(p);
    p = ROT * p * 2.07;
    a *= 0.5;
  }
  return v;
}
/* 脊状噪声：天然出尖峰 */
float rfbm(vec2 p, int oct){
  float v = 0.0, a = 0.52;
  for(int i = 0; i < 6; i++){
    if(i >= oct) break;
    float n = 1.0 - abs(vnoise(p) * 2.0 - 1.0);
    v += a * n * n;
    p = ROT * p * 2.11;
    a *= 0.50;
  }
  return v;
}
vec3 toLin(vec3 c){ return pow(max(c, 0.0), vec3(2.2)); }
vec3 filmic(vec3 c){ return 1.0 - exp(-max(c, 0.0)); }

/* ================= 天空 ================= */
vec3 skyAt(vec2 uv, float A){
  float y = uv.y;
  vec3 hor = toLin(u_skyHor);
  vec3 mid = toLin(u_skyMid);
  vec3 zen = toLin(u_skyZen);

  vec3 c = mix(hor, mid, smoothstep(0.00, 0.42, y));
  c = mix(c, zen, smoothstep(0.30, 1.02, y));

  /* 地平线以下略暗、略暖（承接地气） */
  c = mix(c, hor * 0.62, smoothstep(0.06, -0.16, y));

  /* 太阳散射 */
  if(u_sunI > 0.001){
    vec2 sp = (uv - u_sun.xy) * vec2(A, 1.0);
    float sd = length(sp);
    float low = smoothstep(0.52, -0.06, abs(u_sun.z));
    float scatter = exp(-sd * 3.30) * 0.52
                  + exp(-sd * 2.30) * 0.10
                  + exp(-sd * 0.62) * 0.016;
    c += toLin(u_sunCol) * scatter * u_sunI * (0.14 + 0.72 * low);

    /* 地平线暖带 */
    float band = smoothstep(0.30, 0.0, abs(y - u_sun.y)) * exp(-sd * 1.55);
    c += toLin(u_sunCol) * band * u_sunI * low * 0.105;

    /* 霞：地平线上几条被压扁的暖色层，日出时才出来 */
    float strat = sin(y * 31.0 + fbm(vec2(uv.x * 2.0, 3.0), 3) * 6.0);
    strat = smoothstep(0.58, 1.0, strat);
    strat *= exp(-abs(y - u_sun.y) * 9.0) * low * u_sunI;
    c += toLin(u_sunCol) * strat * 0.055;
  }
  return c;
}

/* ================= 山 ================= */
float mtnShape(float wx, float freq, float seed, float amp){
  float u = wx * freq + seed;
  float a = rfbm(vec2(u * 0.82, seed * 0.31), 4);
  float b = rfbm(vec2(u * 2.24, seed * 0.73), 3);
  float c = rfbm(vec2(u * 5.70, seed * 1.29), 2);

  /* 重新标定：rfbm 实际落在 0.15~0.62，不归一化就是一坨平缓的丘 */
  a = clamp((a - 0.150) / 0.330, 0.0, 1.0);
  b = clamp((b - 0.190) / 0.320, 0.0, 1.0);
  c = clamp((c - 0.230) / 0.300, 0.0, 1.0);

  /* 大尺度决定"哪一带是山" */
  float mass = rfbm(vec2(u * 0.26, seed * 0.13), 3);
  mass = clamp((mass - 0.155) / 0.360, 0.0, 1.0);

  /* 每座峰的陡度不一样 */
  float sharp = 0.95 + 0.62 * fbm(vec2(u * 0.82, seed * 3.1), 2);

  /* 主体是脊，脊上再长脊 */
  float h = (pow(a, sharp) * 1.00
          + pow(b, 2.05) * 0.26 * a
          + pow(c, 2.70) * 0.085 * a) * (0.42 + 0.70 * mass);
  return h * amp;
}

/* 一层山。返回该像素的山的混合量，并把颜色写进 col */
vec4 mtnLayer(vec2 uv, float A, float par, float freq, float seed,
              float amp, float base, float haze, float thick, float t){
  /* 竖屏时横向视野放出去，山才不会压成一根针 */
  float aspectFix = clamp(A / 1.78, 0.52, 1.18);
  float wx = u_camX * par + (uv.x - 0.5) * aspectFix / u_zoom;
  float h  = u_horizon + base + u_mtnLift + mtnShape(wx, freq, seed, amp) * u_mtnAmp;

  /* 树线 / 碎石，让轮廓不像沙丘 */
  float trees = fbm(vec2(wx * (24.0 + 20.0 * thick), seed * 2.0), 3) - 0.44;
  h += trees * 0.0105 * thick;

  /* 边界洇墨 */
  float bleed = (fbm(vec2(wx * 26.0, seed), 3) - 0.5) * 0.0024;

  float d  = h - uv.y + bleed;
  float aa = 0.0016 + 0.0012 * thick;
  float m  = smoothstep(-aa, aa, d);

  /* 山体 */
  vec3 sky_here = skyAt(vec2(uv.x, clamp(h + 0.03, 0.0, 1.0)), A);
  float rock = fbm(vec2(wx * (9.0 + 14.0 * thick), (uv.y - u_horizon) * 8.0 + seed), 3);
  float vert = fbm(vec2(wx * 34.0, (uv.y - u_horizon) * 1.6 + seed * 3.0), 2);
  vec3 body  = toLin(u_mtnCol) * (0.44 + 0.92 * rock + 0.38 * vert * thick);

  /* 大气透视：越远越像天 */
  vec3 hazeCol = mix(sky_here, toLin(u_skyMid), 0.55) * 0.92;
  vec3 mc = mix(body, hazeCol, haze * haze * 1.12);

  /* 山脊轮廓光（背光时山脊被天光镶边） */
  float rimW = 0.0026 + 0.0024 * thick;
  float rim  = exp(-pow((uv.y - h) / rimW, 2.0));
  vec3 rimC  = toLin(u_skyHor) * 0.140 + toLin(u_sunCol) * 0.046 * u_sunI;
  rim *= 0.22 + 0.78 * exp(-abs(uv.x - u_sun.x) * 4.6);
  mc += rimC * rim * (0.18 + 0.38 * (1.0 - haze));

  /* 山脚沉入雾 */
  float foot = smoothstep(h - 0.16, h, uv.y);
  mc = mix(mc * 0.72, mc, foot);

  return vec4(mc, m);
}

/* ================= 雨 ================= */
float rainStreaks(vec2 uv, float A, float t){
  float acc = 0.0;

  /* 雨不是均匀铺满的：有的云段在下，有的云段没下 */
  float gap = fbm(vec2(uv.x * 2.4, uv.y * 1.8 + t * 0.035), 3);
  float sparse = smoothstep(0.26, 0.56, gap);

  for(int k = 0; k < 2; k++){
    float fk = float(k);
    float sc = 30.0 + fk * 30.0;
    float sp = 2.6 + fk * 1.4;
    /* 风把雨丝吹斜 */
    vec2 p = vec2(uv.x * A * sc + uv.y * 110.0 * (0.20 + fk * 0.09),
                  uv.y * sc * 0.44 + t * sp * 3.6);
    vec2 cell = floor(p);
    float r = hash21(cell + fk * 19.7);
    float thr = 0.915 - u_rain * 0.245 + fk * 0.030 + (1.0 - sparse) * 0.065;
    if(r > thr){
      vec2 f = fract(p);
      float x = abs(f.x - 0.5);
      float line = smoothstep(0.175, 0.0, x) * smoothstep(0.48, 0.02, abs(f.y - 0.5));
      acc += line * (r - thr) / (1.0 - thr) * (0.90 - fk * 0.19);
    }
  }
  return acc;
}

/* 水面雨点涟漪 */
float rainRipples(vec2 uv, float A, float t){
  vec2 p = vec2(uv.x * A * 21.0, uv.y * 25.0);
  vec2 cell = floor(p);
  vec2 f = fract(p) - 0.5;
  float r = hash21(cell);
  float ph = fract(t * 0.62 + r * 7.3);
  float d = length(f * vec2(1.0, 1.35));
  float ring = smoothstep(0.06, 0.0, abs(d - ph * 0.40));
  return ring * (1.0 - ph) * step(0.52, r);
}

/* ================= 云 ================= */
vec3 cloudsAt(vec2 uv, float A, float t, out float alpha){
  alpha = 0.0;
  if(u_cloud < 0.01) return vec3(0.0);

  vec3 sum = vec3(0.0);
  float wsum = 0.0;

  /* 高层卷云 */
  {
    vec2 p = vec2((uv.x * A * 1.24 + u_camX * 0.42) * 1.10,
                  (uv.y - 0.52) * 2.35);
    p += fbm(p * 0.52 + 9.0, 3) * 0.42;
    p.x += t * 0.0030 + u_wind * 0.010;
    vec2 pc = p * 0.94;
    float n  = fbm(pc, 4);
    float n2 = fbm(pc + vec2(0.0, 0.085), 4);   /* 往上看一点＝云的上半 */
    float cover = smoothstep(0.470, 0.665, n) * u_cloud;
    cover *= smoothstep(u_horizon - 0.06, u_horizon + 0.30, uv.y);
    cover *= smoothstep(1.06, 0.72, uv.y);

    /* 侧光：朝太阳的一面亮 */
    vec2 sp = (uv - u_sun.xy) * vec2(A, 1.0);
    float lit = 1.0 - smoothstep(0.0, 0.62, length(sp - vec2(0.06, 0.02)));
    vec3 cc = mix(toLin(u_skyMid) * 1.06, toLin(u_sunCol) * 1.50, lit * 0.86)
            + toLin(u_ambCol) * u_amb * 0.13;
    /* 云的暗底 */
    cc *= 0.58 + 0.86 * smoothstep(0.470, 0.720, n2);
    sum += cc * cover;
    wsum += cover;
  }

  /* 低空云海（山腰） */
  {
    vec2 p = vec2((uv.x * A * 0.78 + u_camX * 0.86) * 1.34 + t * 0.0062 + u_wind * 0.014,
                  (uv.y - u_fogY) * 5.2);
    p += fbm(p * 0.62 + 3.0, 3) * 0.55;
    float n = fbm(p * 1.34, 5);
    float cover = smoothstep(0.438, 0.640, n) * u_cloud * 0.54;
    cover *= smoothstep(-0.10, 0.14, uv.y - u_fogY);
    cover *= smoothstep(0.26, 0.02, uv.y - u_fogY);
    /* 云海不许漫进水里 */
    cover *= smoothstep(u_waterY - 0.005, u_waterY + 0.075, uv.y);

    vec3 cc = mix(toLin(u_skyHor) * 0.98, toLin(u_sunCol) * 1.22, 0.32 * u_sunI)
            + toLin(u_ambCol) * u_amb * 0.09;
    sum += cc * cover;
    wsum += cover;
  }

  alpha = clamp(wsum, 0.0, 0.36);
  return sum / max(wsum, 1e-4);
}

/* ================= 星 ================= */
vec3 starsAt(vec2 uv, float A, float t){
  if(u_star < 0.01) return vec3(0.0);

  vec3 acc = vec3(0.0);

  /* 银河 */
  float band = exp(-pow((uv.y - (0.50 + (uv.x - 0.5) * 0.72)) / 0.215, 2.0));
  float g = rfbm(vec2(uv.x * A * 2.9 + 4.0, uv.y * 3.4), 4);
  acc += toLin(vec3(0.52, 0.60, 0.82)) * band * g * g * 0.078 * u_star;
  float dust = rfbm(vec2(uv.x * A * 6.0, uv.y * 6.4 + 2.0), 3);
  acc *= 0.55 + 0.75 * dust;

  /* 亮星 */
  vec2 sp = vec2(uv.x * A * 78.0, uv.y * 84.0);
  vec2 cell = floor(sp);
  float rnd = hash21(cell);
  if(rnd > 0.9725){
    vec2 off = fract(sp) - 0.5;
    float tw = 0.42 + 0.58 * sin(t * 0.62 + rnd * 71.0);
    float s = smoothstep(0.155, 0.0, length(off));
    s *= pow(clamp((rnd - 0.9725) / 0.0275, 0.0, 1.0), 2.2) * 2.9;
    s *= smoothstep(0.34, 0.90, uv.y) * tw * u_star;
    vec3 sc = mix(vec3(0.78, 0.84, 0.90), vec3(0.94, 0.88, 0.74), hash21(cell + 4.0));
    acc += toLin(sc) * s * 0.72;
  }
  /* 暗星 */
  vec2 sp2 = vec2(uv.x * A * 132.0, uv.y * 143.0) + 17.0;
  float r2 = hash21(floor(sp2));
  if(r2 > 0.9905){
    vec2 off = fract(sp2) - 0.5;
    float s = smoothstep(0.13, 0.0, length(off));
    s *= smoothstep(0.30, 0.88, uv.y) * u_star * 0.55;
    acc += toLin(vec3(0.70, 0.78, 0.90)) * s;
  }
  return acc;
}

/* ================= 日月 ================= */
vec3 sunDiscAt(vec2 uv, float A){
  if(u_sunI < 0.001 || u_sun.z < -0.10) return vec3(0.0);
  vec2 p = (uv - u_sun.xy) * vec2(A, 1.0);
  float d = length(p);
  float r = u_sun.w;

  vec3 acc = vec3(0.0);

  /* 光晕：紧贴日轮的一圈，加上出去很远的柔光 */
  float glow = exp(-d * 30.0) * 0.50
             + exp(-d * 9.2)  * 0.120
             + exp(-d * 3.1)  * 0.020;
  /* 贴着一圈日晕，低太阳角时最明显 */
  float lowSun = smoothstep(0.50, 0.02, u_sun.z);
  glow += exp(-pow((d - r * 1.55) / (r * 0.68), 2.0)) * (0.08 + 0.42 * lowSun);
  acc += toLin(u_sunCol) * glow * u_sunI * (1.45 + 0.9 * lowSun);

  float blur = 0.10 + 0.90 * u_rain;
  float disc = 1.0 - smoothstep(r * (0.90 + 0.05 * blur), r * (1.02 + 0.85 * blur), d);
  vec3 core = toLin(u_sunCol) * (2.30 + 1.6 * smoothstep(0.0, 0.10, u_sun.z));
  core *= 1.0 - 0.85 * u_rain;
  /* 边缘略暗，像隔着气 */
  core *= 0.86 + 0.30 * smoothstep(r * 1.02, r * 0.55, d);
  acc += core * disc * u_sunI;

  return acc;
}

vec3 moonAt(vec2 uv, float A, float t){
  if(u_moonI < 0.001 || u_moon.z < -0.06) return vec3(0.0);

  vec2 p = (uv - u_moon.xy) * vec2(A, 1.0);
  float d = length(p);
  float r = u_moon.w;

  vec3 acc = vec3(0.0);

  /* 月华（先画，山会遮住它） */
  float halo = exp(-d * 34.0) * 0.52
             + exp(-d * 13.0) * 0.40
             + exp(-d * 4.6)  * 0.030 * smoothstep(0.62, 0.06, d);
  acc += toLin(vec3(0.775, 0.855, 0.960)) * halo * u_moonI;

  /* 月盘 */
  float disc = 1.0 - smoothstep(r * 0.935, r * 1.020, d);
  if(disc > 0.001){
    float mott = fbm(p * 11.0 + 4.0, 5);
    float shade = 0.74 + 0.38 * smoothstep(0.26, 0.82, mott);
    shade *= 1.0 - 0.14 * smoothstep(0.52, 1.0, d / max(r, 0.0001));
    /* 月面附近的天更透 */
    acc += toLin(vec3(0.938, 0.968, 1.000)) * shade * disc * 1.92 * u_moonI;
  }

  /* 月晕上的一圈薄雾 */
  float ring = exp(-pow((d - r * 1.55) / (r * 0.55), 2.0)) * 0.035;
  acc += toLin(vec3(0.72, 0.80, 0.90)) * ring * u_moonI;

  return acc;
}

/* ================= 外物 ================= */
void drawProp(vec2 uv, float A, float t, inout vec3 col, float inWater){
  if(u_propA < 0.01 || u_prop < 0.5) return;

  vec2 e = (uv - u_propPos) * vec2(A, 1.0) / max(u_propS, 0.001);
  float a = u_propA;

  if(u_prop < 1.5){
    /* 一只鸟 */
    vec2 q = e / 0.018;
    float flap = 0.62 + 0.26 * sin(t * 2.2);
    float d = abs(q.y - abs(q.x) * flap + 0.08 + q.x * q.x * 0.12);
    float body = smoothstep(0.20, 0.0, d) * smoothstep(1.02, 0.62, abs(q.x));
    body += smoothstep(0.20, 0.0, length(q * vec2(1.0, 2.7))) * 0.85;
    col = mix(col, vec3(0.0), clamp(body, 0.0, 1.0) * 0.92 * a);

  } else if(u_prop < 2.5){
    /* 孤舟 */
    vec2 q = e / 0.085;
    float hull = 1.0 - smoothstep(0.70, 1.0, length(q * vec2(1.0, 3.8)));
    float cab  = 1.0 - smoothstep(0.64, 1.0, length((q - vec2(0.02, 0.30)) * vec2(2.6, 2.6)));
    float boat = clamp(hull + cab, 0.0, 1.0);
    col = mix(col, vec3(0.0), boat * 0.95 * a);
    col += toLin(vec3(1.0, 0.62, 0.26)) * exp(-length(e - vec2(0.035, 0.052)) * 880.0) * 0.62 * a;

  } else if(u_prop < 3.5){
    /* 雁阵 */
    for(int i = 0; i < 7; i++){
      float fi = float(i);
      float row = floor(fi * 0.5);
      vec2 off = vec2((fi - row * 2.0) * 0.052, -row * 0.030 + sin(fi * 1.9) * 0.008);
      vec2 q = (e - off) / 0.0105;
      float flap = 0.66 + 0.22 * sin(t * 2.6 + fi * 1.4);
      float d = abs(q.y - abs(q.x) * flap + 0.09);
      float body = smoothstep(0.21, 0.0, d) * smoothstep(1.0, 0.60, abs(q.x));
      col = mix(col, vec3(0.0), clamp(body, 0.0, 1.0) * 0.88 * a);
    }

  } else if(u_prop < 4.5){
    /* 松枝：从边上横过来，压在月亮边上 */
    vec2 q = e;
    float curve = q.x * q.x * 0.30;
    float yy = q.y + curve - 0.016;
    float th = 0.0062 + 0.0078 * smoothstep(0.70, 0.05, q.x);

    float span = smoothstep(0.94, 0.22, q.x) * smoothstep(-0.06, 0.03, q.x);

    float branch = (1.0 - smoothstep(th * 0.45, th, abs(yy))) * span;

    /* 松针：枝两侧的细齿 */
    float teeth = abs(fract(q.x * 30.0) - 0.5) * 2.0;
    float nlen = 0.0040 + 0.0260 * teeth * smoothstep(0.80, 0.10, q.x);
    float nd = abs(yy) - (th + nlen);
    float needles = ((1.0 - smoothstep(0.0, 0.0020, nd)) - branch) * span;

    float m = clamp(branch + needles * 0.92, 0.0, 1.0);
    col = mix(col, vec3(0.0), m * 0.94 * a);

  } else if(u_prop < 5.5){
    /* 芦苇 */
    for(int i = 0; i < 13; i++){
      float fi = float(i);
      float bx = (hash21(vec2(fi * 7.3, 3.1)) - 0.5) * 0.92;
      float hgt = 0.085 + hash21(vec2(fi * 3.7, 9.2)) * 0.090;
      float sway = sin(t * 0.72 + fi * 1.7) * 0.050 + u_wind * 0.085;
      float x = bx + e.y * sway * 2.2;
      float d = abs(e.x - x) / 0.006;
      float stem = (1.0 - smoothstep(0.0, 1.0, d)) * smoothstep(hgt, hgt * 0.22, e.y)
                 * step(e.y, hgt) * step(0.0, e.y);
      /* 穗 */
      float head = smoothstep(0.045, 0.0, length(vec2((e.x - x) * 1.2, (e.y - hgt) * 3.4)));
      col = mix(col, vec3(0.0), clamp(stem * 0.72 + head * 0.55, 0.0, 1.0) * a);
    }

  } else if(u_prop < 6.5){
    /* 远塔 */
    vec2 q = e / 0.032;
    float d = 0.0;
    for(int i = 0; i < 5; i++){
      float fi = float(i);
      float w = 0.62 - fi * 0.085;
      float y0 = fi * 0.52 - 0.10;
      float tier = step(abs(q.x), w) * step(y0, q.y) * step(q.y, y0 + 0.40);
      /* 檐口外挑 */
      float eave = step(abs(q.x), w * 1.30) * step(y0 - 0.075, q.y) * step(q.y, y0);
      d = max(d, tier * 0.90 + eave * 0.55);
    }
    float spire = step(abs(q.x), 0.045) * step(2.44, q.y) * step(q.y, 3.05);
    d = max(d, spire);
    col = mix(col, vec3(0.0), clamp(d, 0.0, 1.0) * 0.90 * a);

  } else if(u_prop < 7.5){
    /* 亭 */
    vec2 q = e / 0.050;
    float roof = step(abs(q.x), 1.05) * step(0.30, q.y) * step(q.y, 0.34 + (1.05 - abs(q.x)) * 0.62);
    float body = step(abs(q.x), 0.62) * step(-0.05, q.y) * step(q.y, 0.30);
    float post = (step(abs(abs(q.x) - 0.54), 0.055) + step(abs(q.x), 0.055)) * step(q.y, 0.30);
    col = mix(col, vec3(0.0), clamp(roof + body * 0.55 + post * 0.62, 0.0, 1.0) * 0.88 * a);

  } else if(u_prop < 8.5){
    /* 萤火 */
    for(int i = 0; i < 11; i++){
      float fi = float(i);
      vec2 base = vec2((hash21(vec2(fi * 2.3, 5.7)) - 0.5) * 2.3,
                       (hash21(vec2(fi * 8.1, 1.9)) - 0.5) * 1.2);
      vec2 pos = base + vec2(sin(t * 0.52 + fi * 2.1) * 0.14,
                             cos(t * 0.44 + fi * 1.3) * 0.09);
      float blink = pow(max(0.0, sin(t * 0.90 + fi * 2.7)), 3.0);
      float d = length((e - pos) * vec2(1.0, 1.0));
      float g = exp(-d * 210.0) * 0.85 + exp(-d * 58.0) * 0.11;
      col += toLin(vec3(0.92, 1.0, 0.56)) * g * blink * a * 1.15;
    }

  } else {
    /* 一个人：斗笠一横，身影一竖。没有头，没有脸，认得出来就行。 */
    if(inWater > 0.5) return;

    vec2 q = e;

    /* 斗笠 */
    float hat = 1.0 - smoothstep(0.76, 1.00,
                length((q - vec2(0.0, 0.345)) * vec2(2.15, 13.0)));

    /* 身影：上宽下窄 */
    float bw = 0.125 + 0.135 * smoothstep(-0.92, 0.40, q.y);
    float body = (1.0 - smoothstep(0.76, 1.02, abs(q.x) / max(bw, 0.001)))
               * (1.0 - smoothstep(0.60, 0.72, abs(q.y + 0.34)));

    float m = clamp(max(hat, body), 0.0, 1.0);

    /* 墨不许齐边 */
    m *= 0.70 + 0.48 * vnoise(q * 7.0 + vec2(11.0, 4.0));
    m = clamp(m, 0.0, 1.0);

    col = mix(col, vec3(0.0), m * 0.90 * a);
  }
}

/* ================= 场景（不画水） ================= */
vec3 sceneDry(vec2 uv, float t, float A, float noOrb){
  vec3 col = skyAt(uv, A);

  col += starsAt(uv, A, t);
  if(noOrb < 0.5){
    col += moonAt(uv, A, t);
    col += sunDiscAt(uv, A);
  }
  float cAlpha = 0.0;
  vec3 cCol = cloudsAt(uv, A, t, cAlpha);
  col = mix(col, cCol * 1.03, cAlpha * 0.86);


  /* 光柱 */
  if(u_sunI > 0.01 && u_sun.z > -0.05){
    vec2 sp = (uv - u_sun.xy) * vec2(A, 1.0);
    float dist = length(sp);
    float ang = atan(sp.y, sp.x);
    float n = fbm(vec2(ang * 3.4 + t * 0.010, dist * 1.6 - t * 0.030), 4);
    n = pow(clamp(n, 0.0, 1.0), 4.2);
    float fall = exp(-dist * 2.35) * smoothstep(0.44, -0.02, abs(u_sun.z));
    col += toLin(u_sunCol) * n * fall * u_sunI * (0.17 + 0.26 * smoothstep(0.30, 0.0, abs(u_sun.z)));
  }

  /* 山：远 → 近 */
  vec4 L;

  L = mtnLayer(uv, A, 0.22, 0.50, 11.3, 0.085, 0.052, 0.760, 0.09, t);
  col = mix(col, L.rgb, L.a * 0.92);

  L = mtnLayer(uv, A, 0.50, 0.92, 27.9, 0.130, 0.004, 0.360, 0.50, t);
  col = mix(col, L.rgb, L.a * 0.96);

  L = mtnLayer(uv, A, 1.00, 1.72, 45.1, 0.185, -0.040, 0.048, 1.00, t);
  col = mix(col, L.rgb, L.a);

  /* 雾 */
  if(u_fog > 0.01){
    vec2 p = vec2(uv.x * 2.06 + u_camX * 0.85, uv.y * 2.72);
    p.x += t * 0.0055;
    p.y -= t * 0.0016;
    vec2 w = vec2(fbm(p * 0.68 + 17.0, 3) - 0.5,
                  fbm(p * 0.68 + vec2(5.3, 9.1), 3) - 0.5);
    vec2 q = p + w * 1.42;
    float d = rfbm(q * 1.02, 5) * 0.88 + fbm(q * 0.44, 3) * 0.32;
    float fd = smoothstep(0.29, 0.55, d);

    float hh = uv.y - u_fogY;
    float band = hh < 0.0 ? 1.0 : 0.018 + 0.982 * exp(-pow(hh * 11.5, 1.22));

    float amt = fd * band * u_fog;
    vec3 fc = toLin(u_fogCol);
    fc += toLin(u_sunCol) * u_sunI * 0.020 * exp(-length((uv - u_sun.xy) * vec2(A, 1.0)) * 1.9);
    col = mix(col, fc, amt * 0.66);
  }

  drawProp(uv, A, t, col, 0.0);

  return col;
}

/* ================= 水 ================= */
vec3 scene(vec2 uv, float t, float A, float refl){
  bool hasWater = u_water > 0.5;
  if(hasWater && uv.y < u_waterY && refl < 0.5){
    float d  = u_waterY - uv.y;
    float dn = clamp(d / max(u_waterY, 0.001), 0.0, 1.0);
    float persp = -log(d + 0.010);

    float warp = fbm(vec2(uv.x * 8.6, persp * 1.72 + t * 0.20), 3);
    warp += u_rain * 0.62 * (fbm(vec2(uv.x * 19.0, persp * 7.0 - t * 1.6), 3) - 0.44);
    float ph   = persp * 18.0 + warp * 24.0 - t * 1.02;
    float w    = sin(ph) * 0.60 + sin(ph * 2.13 + 1.7) * 0.40;

    float amp = 0.0018 + dn * 0.0300;
    float xoff = (w + u_wind * 0.55) * amp * (0.60 + d * 11.0);

    /* 反射：取水面上方的镜像 */
    float ry = u_waterY + d * 2.35;
    vec2 ruv = vec2(uv.x + xoff, clamp(ry, 0.0, 1.0));
    vec3 reflCol = sceneDry(ruv, t, A, 1.0);

    /* 银鳞 */
    float cn1 = fbm(vec2(uv.x * 21.0, persp * 6.6 + t * 0.44), 3);
    float cn2 = fbm(vec2(uv.x * 4.8 + 11.0, persp * 2.1 - t * 0.11), 3);
    float crest = pow(max(0.0, sin(ph + 0.55 + cn1 * 3.0)), 8.0);
    crest *= smoothstep(0.34, 0.66, cn2);
    reflCol += toLin(vec3(0.190, 0.238, 0.268)) * crest * 0.40 * (1.0 - dn * 0.55);

    float fres = 1.0 - smoothstep(0.018, u_waterY * 1.12, d);
    fres = 0.24 + 0.76 * fres;

    vec3 deep = toLin(vec3(0.0014, 0.0040, 0.0056));
    vec3 col  = mix(deep, reflCol * 1.02, fres);

    /* 月 / 日光路 */
    float sr = u_moonI;
    vec2 src = u_moon.xy;
    vec3 tint = vec3(0.80, 0.875, 0.965);      /* 月：银白偏冷 */
    if(u_sunI > sr){ sr = u_sunI; src = u_sun.xy; tint = u_sunCol; }

    if(sr > 0.01){
      float cx = src.x
               + sin(d * 20.0 + t * 0.40) * 0.0034
               + sin(d * 8.2 - t * 0.23) * 0.0078;
      float mx = (uv.x - cx) * A;
      float beamW = 0.030 + d * 0.255;
      float beam = exp(-pow(mx / beamW, 2.0));
      /* 水面把光切成一段一段 */
      float beamN = fbm(vec2((uv.x - cx) * A * 4.6, d * 11.0 - t * 0.22), 3);
      beam *= 0.26 + 1.05 * beamN;
      float nearAtt = exp(-d * 2.7);
      float beamGain = (u_sunI > u_moonI)
                      ? (0.28 + 0.72 * smoothstep(0.50, 0.03, u_sun.z))
                      : 1.0;
      col += toLin(tint) * beam * nearAtt * (0.215 * sr * beamGain);

      /* 碎金 */
      vec2 gp = vec2(uv.x * A * 162.0, persp * 26.0);
      vec2 gi = floor(gp);
      float rnd = hash21(gi);
      vec2 goff = vec2(hash21(gi + 3.1), hash21(gi + 7.9)) * 0.58 + 0.21;
      vec2 gq = fract(gp) - goff;
      gq.x *= 0.44;
      float spark = smoothstep(0.23, 0.0, length(gq));
      spark *= step(0.24, rnd) * (0.34 + 0.66 * sin(t * 1.55 + rnd * 63.0));
      col += toLin(tint) * beam * nearAtt * spark * 1.05 * sr;
    }

    /* 雨点打在水面上 */
    if(u_rain > 0.01){
      float rp = rainRipples(uv, A, t);
      col += toLin(vec3(0.40, 0.48, 0.56)) * rp * u_rain * (1.05 + 0.55 * u_moonI);
    }

    /* 水面浮雾 */
    if(u_fog > 0.01){
      vec2 p = vec2(uv.x * 2.6, d * 5.2 + t * 0.10);
      float fd = rfbm(p * 1.2, 4);
      float hf = smoothstep(0.0, 0.020, d) * smoothstep(u_waterY, u_waterY * 0.28, d);
      col = mix(col, toLin(u_fogCol) * 0.92,
                smoothstep(0.30, 0.62, fd) * hf * u_fog * 0.50);
    }

    /* 水线一线光 */
    float hz = exp(-pow((d - 0.006) * 96.0, 2.0));
    hz *= 0.28 + 0.72 * fbm(vec2(uv.x * 4.6, 2.0 + t * 0.05), 3);
    col += toLin(mix(u_skyMid, u_sunCol, 0.20 + 0.55 * u_sunI)) * hz * (0.030 + u_sunI * 0.055);

    /* 水面上也有东西：船、芦苇、萤火。岸上的人不在这里画。 */
    drawProp(uv, A, t, col, 1.0);

    return col;
  }
  return sceneDry(uv, t, A, 0.0);
}

/* ================= 主 ================= */
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  float A = u_res.x / u_res.y;
  float t = u_time;

  /* 镜头走起来：先摇，再轻轻侧一点。
     摇是整幅画面一起平移（天空、日月、山、水全跟着），
     平移产生的视差留给 u_camX —— 两者叠加才是"镜头在动"。 */
  if(abs(u_roll) > 0.0001){
    vec2 q = uv - 0.5;
    float ca = cos(u_roll), sa = sin(u_roll);
    uv = vec2(ca * q.x - sa * q.y, sa * q.x + ca * q.y) + 0.5;
  }
  uv.x += u_pan;

  vec3 col = scene(uv, t, A, 0.0);

  /* 雨丝：用屏幕坐标，不跟镜头摇 —— 雨是充满整个空间的 */
  if(u_rain > 0.01){
    vec2 suv = gl_FragCoord.xy / u_res;
    float rs = rainStreaks(suv, A, t);
    vec3 rainCol = mix(toLin(vec3(0.62, 0.70, 0.80)), toLin(vec3(0.82, 0.86, 0.90)), 1.0 - u_amb);
    col += rainCol * rs * u_rain * (0.55 + 0.45 * u_rain);
  }

  /* 雾场（章节转场） */
  col = mix(col, toLin(u_mistCol), u_mist * 0.97);

  /* 暗角按屏幕算，不跟着画面跑 */
  vec2 vq = (gl_FragCoord.xy / u_res - 0.5) * vec2(A, 1.0);
  col *= clamp(1.0 - dot(vq, vq) * 0.42 * u_vign, 0.0, 1.0);

  /* 雨幕：把整幅压薄一层，雨天才真的"看不远" */
  if(u_rain > 0.01){
    col = mix(col, toLin(vec3(0.34, 0.39, 0.46)) * 0.34, u_rain * 0.22);
  }

  /* 呼吸 */
  col *= 1.0 + 0.014 * sin(t * 0.27 - 1.2);

  /* 宣纸 */
  vec2 fc = gl_FragCoord.xy;
  float paper = fbm(fc * 0.40, 4);
  float fiber = vnoise(vec2(fc.x * 0.92, fc.y * 0.10)) * 0.5
              + vnoise(vec2(fc.x * 0.09, fc.y * 0.86)) * 0.5;
  col *= 0.964 + 0.052 * paper + 0.021 * fiber;

  col = max(col - 0.00080, 0.0);

  col = filmic(col);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  col = mix(col, col * col * (3.0 - 2.0 * col), 0.32);

  /* 黑场 */
  col *= (1.0 - u_fade);

  col += (hash21(fc + fract(t) * 371.0) - 0.5) * 0.015;
  col.r *= 0.994;
  col.b *= 1.006;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
(function(){
"use strict";

/* ============================================================
   梦之画境 · 九章百十幕
   ------------------------------------------------------------
   一条连续的光：日落后入夜 → 月升 → 午夜 → 将晓 → 月落日出
   → 晨 → 午 → 暮 → 入夜。镜头是一条滑轨，光是一条曲线。
   ============================================================ */

var TAU = Math.PI * 2;
var clamp = function(v,a,b){ return v < a ? a : (v > b ? b : v); };
var lerp  = function(a,b,f){ return a + (b-a)*f; };
var ease  = function(f){ return f*f*(3-2*f); };
var smoothstep = function(a,b,x){ var t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ---------------- 诗：一百一十句，一气贯下 ---------------- */
var V = [
["天把最后一笔","收进袖子里","只剩墨"],

var CHAPTERS = [
  { name:"一 · 夜起", en:"Nightfall",      from:0,  to:13  },
  { name:"二 · 水深", en:"Deep Water",     from:14, to:27  },
  { name:"三 · 雾生", en:"The Fog",        from:28, to:39  },
  { name:"四 · 黑极", en:"Utter Dark",     from:40, to:51  },
  { name:"五 · 将晓", en:"Before Dawn",    from:52, to:63  },
  { name:"六 · 日出", en:"Sunrise",        from:64, to:77  },
  { name:"七 · 晨",   en:"Morning",        from:78, to:89  },
  { name:"八 · 午",   en:"Noon",           from:90, to:101 },
  { name:"九 · 暮归", en:"Dusk",           from:102,to:109 }
];

var N = SHOTS.length;

/* 章索引 → 幕 */
var chapterOf = new Array(N);
for(var c = 0; c < CHAPTERS.length; c++)
  for(var k = CHAPTERS[c].from; k <= CHAPTERS[c].to; k++) chapterOf[k] = c;

/* 剪辑节奏：原来每一幕都是三秒半，一秒不差，看着就"平"。
   现在开头收住、黑极放快、日出停够、结尾拖长。 */
(function shapeDurations(){
  for(var i = 0; i < N; i++){
    var ch = chapterOf[i];
    var k = 1.0;
    if(i === 0) k *= 1.55;
    if(i === N - 1) k *= 1.62;
    if(i === CHAPTERS[ch].from) k *= 1.16;
    if(i === CHAPTERS[ch].to)   k *= 1.10;
    if(ch === 3) k *= 0.84;        /* 黑极：别拖 */
    if(ch === 5) k *= 1.14;        /* 日出：停住 */
    if(ch === 8) k *= 1.16;        /* 暮归：收 */
    SHOTS[i].d = Math.round(SHOTS[i].d * k * 10) / 10;
  }
})();

/* 起始时间 */
var starts = [], total = 0;
for(var i = 0; i < N; i++){ starts.push(total); total += SHOTS[i].d; }

/* ---------------- 天光查询 ---------------- */
function lightAt(dayT){
  var d = dayT;
  while(d < 0) d += 1;
  d = d % 1;
  /* 表按 0..1.84 排，跨过 1 的用 1+d */
  var q = d;
  if(q < LIGHT[0][0]) q += 1;
  if(dayT > 1.0 && dayT < 1.84) q = dayT;

  var lo = 0, hi = LIGHT.length - 1;
  while(lo < hi){
    var mid = (lo + hi + 1) >> 1;
    if(LIGHT[mid][0] <= q) lo = mid; else hi = mid - 1;
  }
  var A = LIGHT[lo], B = LIGHT[Math.min(LIGHT.length-1, lo+1)];
  var span = Math.max(1e-5, B[0] - A[0]);
  var f = ease(clamp((q - A[0]) / span, 0, 1));

  var out = { zen:[0,0,0], mid:[0,0,0], hor:[0,0,0],
              sunCol:[0,0,0], sunI:0, ambCol:[0,0,0], amb:0,
              mtnCol:[0,0,0], star:0 };
  function mix3(a,b){
    return [ lerp(a[0],b[0],f), lerp(a[1],b[1],f), lerp(a[2],b[2],f) ];
  }
  out.zen    = mix3(A[1], B[1]);
  out.mid    = mix3(A[2], B[2]);
  out.hor    = mix3(A[3], B[3]);
  out.sunCol = mix3(A[4], B[4]);
  out.sunI   = lerp(A[5], B[5], f);
  out.ambCol = mix3(A[6], B[6]);
  out.amb    = lerp(A[7], B[7], f);
  out.mtnCol = mix3(A[8], B[8]);
  out.star   = lerp(A[9], B[9], f);
  return out;
}

var quality = 1.0, maxPx = 2.35e6;

function resize(){
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if(!w || !h) return;
  var fit = Math.min(1, Math.sqrt(maxPx / (w * h)));
  var dpr = Math.min(window.devicePixelRatio || 1, 2) * fit * quality;
  var pw = Math.max(1, Math.floor(w * dpr));
  var ph = Math.max(1, Math.floor(h * dpr));
  if(canvas.width !== pw || canvas.height !== ph){
    canvas.width = pw;
    canvas.height = ph;
    gl.viewport(0, 0, pw, ph);
  }
  if(U.u_res) gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

/* ---------------- 播放状态 ---------------- */
var clock = (fixedAt !== null) ? fixedAt : 0;
var playing = !startPaused;
var started = shotMode;
var ended = false;

var sm = { x:0, h:0.36, z:1.0, day:0.78, c:0.4, f:0.5, w:1, rain:0 };  /* 平滑器 */
var smInit = false;

function locate(t){
  var lo = 0, hi = N - 1;
  while(lo < hi){
    var mid = (lo + hi + 1) >> 1;
    if(starts[mid] <= t) lo = mid; else hi = mid - 1;
  }
  var f = clamp((t - starts[lo]) / Math.max(0.001, SHOTS[lo].d), 0, 1);
  return { i: lo, f: f };
}

/* ---------------- 渲染 ---------------- */
var t0 = performance.now();
var last = t0;
var raf = 0;
var visible = true;
var fpsFrames = 0, fpsMark = t0;

var lastChapter = -1, chapterFade = 0;
var lastAct = -1;

document.addEventListener("visibilitychange", function(){
  visible = !document.hidden;
  if(visible){ last = performance.now(); raf = requestAnimationFrame(frame); }
  else cancelAnimationFrame(raf);
});

function propPos(name, hz, waterY, camX, moonX){
  var drift = camX || 0;
  var mx = (moonX === undefined) ? 0.62 : moonX;
  switch(name){
    case "bird":      return [0.64 + drift * 0.5, 0.74, 1.0];
    case "geese":     return [0.56 + drift * 0.4, 0.78, 1.0];
    case "boat":      return [mx - 0.085, waterY + 0.034, 1.55];
    /* 松枝压在月亮左侧，剪影才立得住 */
    case "pine":      return [0.02, 1.02, 2.05];
    /* 芦苇立在水线上，背后是天 */
    case "reeds":     return [Math.max(0.14, Math.min(0.86, mx - 0.34 + drift * 0.3)), waterY - 0.004, 1.20];
    case "pagoda":    return [0.70 - drift * 0.5, hz + 0.128, 1.55];
    case "pavilion":  return [0.28 + drift * 0.6, hz + 0.066, 1.30];
    case "fireflies": return [0.50 + drift * 0.5, waterY + 0.035, 1.0];
    /* 人站在水边，最好背光；小到只有几粒像素 */
    case "person":    return [mx + 0.004, waterY + 0.022, 0.0205];
  }
  return [0.5, 0.5, 1];
}

function frame(now){
  raf = requestAnimationFrame(frame);
  if(!visible) return;

  var dt = Math.min(0.06, (now - last) / 1000);
  last = now;

  if(fixedAt !== null){
    clock = fixedAt;
  } else if(started && playing && !ended){
    clock += dt;
    if(clock >= total){ clock = total; ended = true; showOutro(); }
  }

  var loc = locate(clock);
  var i = loc.i, f = loc.f;
  var A = SHOTS[i];
  var B = SHOTS[Math.min(N - 1, i + 1)];

  var e = ease(f);
  var tx = lerp(A.x, B.x, e);
  var th = lerp(A.h, B.h, e);
  var tz = lerp(A.z, B.z, e);
  var tday = lerp(A.t, B.t, e);
  var tc   = lerp(A.c, B.c, e);
  var tf   = lerp(A.f, B.f, e);
  var tw   = lerp(A.w, B.w, e);

  if(!smInit){
    sm.x = tx; sm.h = th; sm.z = tz; sm.day = tday;
    sm.c = tc; sm.f = tf; sm.w = tw; smInit = true;
  } else {
    var k = 1 - Math.exp(-dt * 7.0);
    sm.x   += (tx   - sm.x)   * k;
    sm.h   += (th   - sm.h)   * k;
    sm.z   += (tz   - sm.z)   * k;
    sm.day += (tday - sm.day) * k;
    sm.c   += (tc   - sm.c)   * k;
    sm.f   += (tf   - sm.f)   * k;
    sm.w   += (tw   - sm.w)   * k;
  }

  var L = lightAt(sm.day);

  /* 日月位置：一条连续的弧 */
  var dnorm = ((sm.day % 1) + 1) % 1;
  var sunAng = TAU * (dnorm - 0.25);
  var sunAlt = Math.sin(sunAng);
  var sunX   = 0.5 + 0.32 * Math.cos(sunAng);

  var mAng = TAU * (dnorm - 0.75);
  var mAlt = Math.sin(mAng);
  var mX   = 0.5 + 0.32 * Math.cos(mAng);

  var sunR = 0.032;
  var moonR = 0.0395;

  /* 高度只由天球角决定：镜头怎么动，日月都按自己的轨迹走 */
  var sunY  = 0.405 + sunAlt * 0.455;
  var moonY = 0.428 + mAlt  * 0.500;

  var moonI = clamp(mAlt * 2.6 + 0.10, 0, 1);
  moonI *= (1 - clamp(sunAlt * 3.0, 0, 0.94));
  moonI *= 0.94;

  var chNow = chapterOf[i];

  /* 两场雨：雾生里一场薄的，晨末到午初一场像样的 */
  var rainAmt = 0;
  if(i >= 29 && i <= 40){
    rainAmt = Math.max(rainAmt, Math.sin((i - 29) / 11 * Math.PI) * 0.42);
  }
  if(i >= 83 && i <= 97){
    rainAmt = Math.max(rainAmt, Math.sin((i - 83) / 14 * Math.PI) * 0.82);
  }
  /* 平滑，别让雨突然开始 */
  if(!smInit) sm.rain = rainAmt;
  sm.rain += (rainAmt - (sm.rain || 0)) * (1 - Math.exp(-dt * 2.2));
  var rain = sm.rain;

  /* 山不再自己升降 —— 抬升交给镜头俯仰(u_horizon)，山的形状交给 u_mtnAmp */
  var mtnAmp = 1.0;

  /* 摇：几个互质周期的慢正弦叠起来，永不重复，也不会卡在端点 */
  var pan = 0.215 * Math.sin(clock * 0.0405)
          + 0.082 * Math.sin(clock * 0.0151 + 1.9)
          + 0.034 * Math.sin(clock * 0.0097 + 4.1);

  /* 移：横向平移，产生视差（近山动得多，远山几乎不动） */
  var dolly = 0.320 * Math.sin(clock * 0.0212 + 0.7)
            + 0.115 * Math.sin(clock * 0.0471 + 2.1);

  /* 推拉：焦距缓慢呼吸 */
  var zDrift = 1.0
             + 0.125 * Math.sin(clock * 0.0251 + 0.8)
             + 0.038 * Math.sin(clock * 0.0913 + 1.4);

  /* 侧倾：不到半度，只是让画面"活" */
  var roll = 0.0052 * Math.sin(clock * 0.0131 + 2.4);

  /* 风：几个周期叠起来，像阵风，不是匀速吹 */
  var wind = 0.55 * Math.sin(clock * 0.44)
           + 0.28 * Math.sin(clock * 1.31 + 1.7)
           + 0.17 * Math.sin(clock * 0.19 + 4.2);

  var waterY = sm.h - 0.055 - (1 - sm.w) * 0.62;
  var fogY   = sm.h - 0.085;

  /* 章节转场：章首 / 章尾的雾 */
  var ch = chapterOf[i];
  var mist = 0;
  var isFirst = (i === CHAPTERS[ch].from);
  var isLast  = (i === CHAPTERS[ch].to);
  if(dt > 0){
    if(isFirst && f < 0.30) mist = Math.max(mist, 1 - f / 0.30);
    if(isLast  && f > 0.70) mist = Math.max(mist, (f - 0.70) / 0.30);
  }
  mist *= 0.94;

  /* 外物 */
  var propName = A.p;
  var propCode = { pine:4, bird:1, boat:2, geese:3, reeds:5, pagoda:6, pavilion:7, fireflies:8, person:9 }[propName] || 0;
  var pp = propPos(propName, sm.h, waterY, sm.x, mX);
  var propA = 0;
  if(propCode){
    var prevSame = (i > 0) && (SHOTS[i - 1].p === propName);
    var nextSame = (i < N - 1) && (SHOTS[i + 1].p === propName);
    var aIn  = prevSame ? 1 : smoothstep(0.0, 0.17, f);
    var aOut = nextSame ? 1 : smoothstep(0.0, 0.17, 1 - f);
    propA = aIn * aOut;
  }

  /* 上传 */
  gl.uniform1f(U.u_time, clock);
  gl.uniform1f(U.u_camX, dolly);
  gl.uniform1f(U.u_horizon, sm.h);
  gl.uniform1f(U.u_zoom, sm.z * zDrift);
  gl.uniform1f(U.u_pan, pan);
  gl.uniform1f(U.u_roll, roll);
  gl.uniform1f(U.u_wind, wind);

  gl.uniform3fv(U.u_skyZen, L.zen);
  gl.uniform3fv(U.u_skyMid, L.mid);
  gl.uniform3fv(U.u_skyHor, L.hor);
  gl.uniform3fv(U.u_sunCol, L.sunCol);
  gl.uniform1f(U.u_sunI, L.sunI * (1.0 - rain * 0.78));
  gl.uniform3fv(U.u_ambCol, L.ambCol);
  gl.uniform1f(U.u_amb, L.amb);

  gl.uniform4f(U.u_sun, sunX, sunY, sunAlt, sunR);
  gl.uniform4f(U.u_moon, mX, moonY, mAlt, moonR);
  gl.uniform1f(U.u_moonI, moonI * 0.96);
  gl.uniform1f(U.u_star, L.star);

  gl.uniform1f(U.u_rain, rain);
  gl.uniform1f(U.u_cloud, Math.min(1.0, sm.c + rain * 0.45));
  gl.uniform1f(U.u_fog, sm.f * 0.62 + rain * 0.30);
  gl.uniform1f(U.u_fogY, fogY);

  gl.uniform3fv(U.u_fogCol, [
    0.022 + L.hor[0] * 0.085 + L.zen[0] * 0.34 + L.mid[0] * 0.20,
    0.029 + L.hor[1] * 0.100 + L.zen[1] * 0.36 + L.mid[1] * 0.21,
    0.039 + L.hor[2] * 0.120 + L.zen[2] * 0.40 + L.mid[2] * 0.22
  ]);
  gl.uniform3fv(U.u_mtnCol, L.mtnCol);
  gl.uniform1f(U.u_mtnAmp, mtnAmp);
  gl.uniform1f(U.u_mtnLift, 0.0);

  gl.uniform1f(U.u_water, 1.0);
  gl.uniform1f(U.u_waterY, waterY);

  gl.uniform1f(U.u_prop, propCode);
  gl.uniform2f(U.u_propPos, pp[0], pp[1]);
  gl.uniform1f(U.u_propS, pp[2]);
  gl.uniform1f(U.u_propA, propA);

  gl.uniform1f(U.u_mist, mist);
  gl.uniform3fv(U.u_mistCol, [
    0.040 + L.hor[0] * 0.34 + L.zen[0] * 0.22,
    0.048 + L.hor[1] * 0.38 + L.zen[1] * 0.24,
    0.058 + L.hor[2] * 0.42 + L.zen[2] * 0.28
  ]);
  gl.uniform1f(U.u_vign, 0.92);
  gl.uniform1f(U.u_fade, 0);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* 文字 */
  if(i !== lastAct || Math.abs(f - 0.5) < 0.5){
    for(var kk = 0; kk < N; kk++){
      var dd = Math.abs(clock - starts[kk]) / Math.max(0.001, SHOTS[kk].d);
      if(dd > 2.2){
        if(actEls[kk].style.opacity !== "0") actEls[kk].style.opacity = "0";
      } else {
        var op = 1 - smoothstep(0.30, 0.66, dd);
        actEls[kk].style.opacity = op.toFixed(3);
      }
    }
    lastAct = i;
  }

  /* 章名 */
  if(ch !== lastChapter){
    lastChapter = ch;
    chapCn.textContent = CHAPTERS[ch].name;
    chapEn.textContent = CHAPTERS[ch].en;
    chapEl.style.opacity = "1";
  }

  /* 底部 */
  var prog = total > 0 ? clock / total : 0;
  barMark.style.width = (prog * 100).toFixed(2) + "%";
  barDot.style.left = (prog * 100).toFixed(2) + "%";
  var secs = Math.floor(clock);
  tcEl.textContent = ("0" + Math.floor(secs / 60)).slice(-2) + ":" + ("0" + (secs % 60)).slice(-2);

  numTxt.textContent =
    ("00" + (i + 1)).slice(-3) + " / " + N;

  /* 声音调度 */
  pumpAudio(chNow, now, rain);
  setRainLevel(rain);

  /* FPS 自适应 */
  fpsFrames++;
  if(now - fpsMark > 1500){
    var fps = fpsFrames * 1000 / (now - fpsMark);
    if(fps < 40 && quality > 0.55){ quality -= 0.15; resize(); }
    fpsFrames = 0; fpsMark = now;
  }
}

/* ---------------- 声音：现场合成的古风拨弦 ----------------
   D 羽调五声（D F G A C），Karplus 式的拨弦包络 + 长混响。
   不引用任何外部音频文件，离线可用。                          */

var AC = window.AudioContext || window.webkitAudioContext;
var AU = { ctx:null, master:null, ready:false, on:false,
           nextAt:0, idx:0, mi:0, lastPump:0, gain:0.32 };

function makeImpulse(ctx, sec, decay){
  var rate = ctx.sampleRate;
  var len = Math.floor(rate * sec);
  var buf = ctx.createBuffer(2, len, rate);
  for(var c = 0; c < 2; c++){
    var d = buf.getChannelData(c);
    for(var i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio(){
  if(AU.ready || !AC) return;
  try{
    var ctx = new AC();
    AU.ctx = ctx;

    var master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(ctx.destination);

    var conv = ctx.createConvolver();
    conv.buffer = makeImpulse(ctx, 3.6, 2.7);
    var wet = ctx.createGain();
    wet.gain.value = 0.58;
    master.connect(conv);
    conv.connect(wet);
    wet.connect(ctx.destination);

    AU.master = master;
    AU.ready = true;
  }catch(e){ AU.ready = false; }
}

/* Karplus-Strong：一段噪声塞进环形延迟线，每绕一圈过一遍低通再衰减。
   泛音是一圈一圈掉下去的 —— 这才是"拨"出来的声音，不是"合成"的。 */
var KS_CACHE = {};
var KS_COUNT = 0;

function ksBuffer(freq, dur, bright){
  var rate = AU.ctx.sampleRate;
  var key = Math.round(freq) + "_" + Math.round(dur * 8) + "_" + Math.round(bright * 8);
  if(KS_CACHE[key]) return KS_CACHE[key];

  var len = Math.max(128, Math.floor(rate * dur));
  var buf = AU.ctx.createBuffer(1, len, rate);
  var d = buf.getChannelData(0);

  var period = Math.max(2, Math.round(rate / freq));
  var line = new Float32Array(period);

  /* 激励：指甲触弦那一下 */
  for(var i = 0; i < period; i++){
    line[i] = (Math.random() * 2 - 1) * (1 - i / period * 0.55);
  }

  var idx = 0, prev = 0;
  var lp = 0.44 + bright * 0.36;
  var decay = 0.9958 - freq * 0.000017;
  if(decay > 0.9978) decay = 0.9978;
  if(decay < 0.9740) decay = 0.9740;

  for(var m = 0; m < len; m++){
    var cur = line[idx];
    var f = cur * lp + prev * (1 - lp);
    prev = f;
    line[idx] = f * decay;
    d[m] = cur;
    idx++;
    if(idx >= period) idx = 0;
  }

  if(KS_COUNT > 70){ KS_CACHE = {}; KS_COUNT = 0; }
  KS_CACHE[key] = buf;
  KS_COUNT++;
  return buf;
}

function pluck(freq, t, dur, amp, bright){
  var ctx = AU.ctx;
  if(!ctx || !(freq > 20)) return;

  var b = (bright === undefined) ? 0.55 : bright;
  var buf = ksBuffer(freq, dur, b);

  var src = ctx.createBufferSource();
  src.buffer = buf;

  var g = ctx.createGain();
  g.gain.value = amp;
  src.connect(g);
  g.connect(AU.master);
  src.start(t);
  src.stop(t + dur + 0.06);

  /* 吟猱：左手揉弦，一点点音高摆动 */
  try{
    var lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 4.4 + Math.random() * 1.7;
    var lg = ctx.createGain();
    lg.gain.value = 0.0032;
    lfo.connect(lg);
    lg.connect(src.playbackRate);
    lfo.start(t);
    lfo.stop(t + dur + 0.06);
  }catch(e){}

  /* 触弦噪声：极短，只为了让起音"利"一点 */
  if(amp > 0.026){
    var nlen = Math.max(16, Math.floor(ctx.sampleRate * 0.0065));
    var nb = ctx.createBuffer(1, nlen, ctx.sampleRate);
    var nd = nb.getChannelData(0);
    for(var i = 0; i < nlen; i++){
      nd[i] = (Math.random() * 2 - 1) * (1 - i / nlen);
    }
    var ns = ctx.createBufferSource();
    ns.buffer = nb;
    var hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 2600;
    var ng = ctx.createGain();
    ng.gain.value = amp * 0.28;
    ns.connect(hp); hp.connect(ng); ng.connect(AU.master);
    ns.start(t);
  }
}

function breath(freq, t, dur, amp){
  var ctx = AU.ctx;
  if(!ctx) return;
  var o = ctx.createOscillator();
  o.type = "sine";
  o.frequency.value = freq;
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(amp, t + dur * 0.35);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(AU.master);
  o.start(t); o.stop(t + dur + 0.05);
}

var SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
var ROOT_HZ = 146.83;   /* D3 */

/* 九章九句。半音数，相对 D。
   夜低回、日出上行、午回落、暮收束。 */
var MOTIF = [
  [0, 7, 5, 3],
  [0, 5, 3, 7],
  [5, 3, 0, 3],
  [0, 3, 0, -2],
  [3, 5, 7, 10],
  [7, 10, 12, 15],
  [12, 10, 7, 5],
  [7, 5, 3, 0],
  [3, 0, 3, 5]
];

var lastChirp = 0;
function pumpAudio(chIdx, nowMs, rainAmt){
  if(!AU.ready || !AU.on) return;
  if(nowMs - AU.lastPump < 160) return;
  AU.lastPump = nowMs;

  var ctx = AU.ctx;
  var now = ctx.currentTime;
  if(AU.nextAt < now) AU.nextAt = now + 0.05;

  while(AU.nextAt < now + 1.4){
    /* 夜低、晨高、午后回落 */
    var oct = 0;
    if(chIdx === 5 || chIdx === 6) oct = 12;
    else if(chIdx === 7) oct = 7;

    var motif = MOTIF[Math.min(MOTIF.length - 1, Math.max(0, chIdx | 0))] || MOTIF[0];
    var step = motif[AU.mi % motif.length];
    AU.mi++;

    var f = ROOT_HZ * Math.pow(2, (step + oct) / 12);
    var dur = 2.4 + Math.random() * 1.3;

    var bright = 0.34 + 0.10 * Math.min(8, Math.max(0, chIdx | 0));
    pluck(f, AU.nextAt, dur, 0.052 + Math.random() * 0.020, bright);

    /* 山谷回一声 */
    pluck(f, AU.nextAt + 0.46, dur * 0.66, 0.017, bright);

    /* 偶尔一个倚音 */
    if(AU.mi % 5 === 3) pluck(f * 1.125, AU.nextAt + 0.30, 1.2, 0.014, bright + 0.10);

    /* 每八音落一个根音 */
    if(AU.mi % 8 === 1) breath(ROOT_HZ * 0.5, AU.nextAt, 11.0, 0.030);

    /* 天亮、雨小的时候，才有人家的鸟 */
    if(chIdx >= 4 && chIdx <= 8 && (rainAmt || 0) < 0.45 && AU.idx % 5 === 2){
      chirpGroup(AU.nextAt + 0.4, 1700 + Math.random() * 1100, 2 + (AU.idx % 3));
    }

    AU.nextAt += 1.32 + Math.random() * 0.52;
    AU.idx++;
  }
}

function synthStart(){
  initAudio();
  if(!AU.ready) return;
  try{
    if(AU.ctx.state === "suspended") AU.ctx.resume();
  }catch(e){}
  AU.on = true;
  var t = AU.ctx.currentTime;
  AU.master.gain.cancelScheduledValues(t);
  AU.master.gain.setTargetAtTime(AU.gain, t, 1.4);
  AU.nextAt = t + 0.35;
  AU.idx = 0;
  AU.mi = 0;
  initRain();
  sndEl.classList.add("on");
}

/* 同目录有 bgm.mp3 就放它；没有就合成 */
/* ---- 雨声：白噪声过带通，随雨量推子 ---- */
var RAIN = { src:null, gain:null, ready:false };

function initRain(){
  if(RAIN.ready || !AU.ctx) return;
  var ctx = AU.ctx;
  var len = Math.floor(ctx.sampleRate * 3);
  var buf = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  var src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;

  var hp = ctx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 620;

  var lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 6400;

  var g = ctx.createGain();
  g.gain.value = 0.0001;

  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(AU.master);
  src.start();

  RAIN = { src:src, gain:g, ready:true };
}

var rainShown = -1;
function setRainLevel(v){
  if(!RAIN.ready) return;
  if(Math.abs(v - rainShown) < 0.02) return;
  rainShown = v;
  RAIN.gain.gain.setTargetAtTime(Math.max(0.0001, v * 0.18), AU.ctx.currentTime, 0.7);
}

/* ---- 鸟：两三声短促的上滑音 ---- */
function chirpGroup(t, base, count){
  var ctx = AU.ctx;
  for(var i = 0; i < count; i++){
    var tt = t + i * (0.052 + Math.random() * 0.03);
    var f0 = base * (0.90 + Math.random() * 0.24);
    var dur = 0.050 + Math.random() * 0.055;

    var o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, tt);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.58, tt + dur * 0.35);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.90, tt + dur);

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(0.030, tt + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);

    o.connect(g); g.connect(AU.master);
    o.start(tt); o.stop(tt + dur + 0.02);
  }
}

function startAudio(){
  if(bgmEl && bgmEl.getAttribute("src")){
    var pr = null;
    try{ pr = bgmEl.play(); }catch(e){ pr = null; }
    if(pr && pr.then){
      pr.then(function(){
        bgmEl.volume = 0;
        var t0 = performance.now();
        function ramp(){
          var k = Math.min(1, (performance.now() - t0) / 2600);
          bgmEl.volume = 0.46 * k;
          if(k < 1) requestAnimationFrame(ramp);
        }
        ramp();
        sndEl.classList.add("on");
      }).catch(function(){ synthStart(); });
      return;
    }
  }
  synthStart();
}

function stopAudio(){
  if(bgmEl && !bgmEl.paused){
    try{ bgmEl.pause(); }catch(e){}
    sndEl.classList.remove("on");
    return;
  }
  if(!AU.ready) return;
  AU.on = false;
  var t = AU.ctx.currentTime;
  AU.master.gain.cancelScheduledValues(t);
  AU.master.gain.setTargetAtTime(0.0001, t, 0.45);
  sndEl.classList.remove("on");
}

function isAudioOn(){
  return AU.on || (bgmEl && !bgmEl.paused);
}

function toggleAudio(){
  if(isAudioOn()) stopAudio(); else startAudio();
}

/* ---------------- 交互 ---------------- */
function setPlaying(p){
  playing = p;
  btn.classList.toggle("paused", !p);
}
setPlaying(playing);

btn.addEventListener("click", function(ev){
  ev.stopPropagation();
  if(ended) return;
  setPlaying(!playing);
});

canvas.addEventListener("click", function(){
  if(performance.now() - audioStartedAt < 420) return;
  if(!started || ended) return;
  setPlaying(!playing);
});

function jumpTo(t){
  clock = clamp(t, 0, total);
  ended = false;
  outroEl.classList.remove("show");
  smInit = false;
  started = true;
}

window.addEventListener("keydown", function(ev){
  if(ev.key === " " || ev.key === "k"){
    ev.preventDefault();
    if(ended) return;
    setPlaying(!playing);
    return;
  }
  if(ev.key === "ArrowLeft" || ev.key === "ArrowRight"){
    ev.preventDefault();
    var i = locate(clock).i;
    var j = i + (ev.key === "ArrowRight" ? 1 : -1);
    j = Math.max(0, Math.min(N - 1, j));
    jumpTo(starts[j] + 0.05);
    return;
  }
  if(ev.key === "f" || ev.key === "F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
});

bar.addEventListener("click", function(ev){
  var r = bar.getBoundingClientRect();
  var p = clamp((ev.clientX - r.left) / r.width, 0, 1);
  clock = p * total;
  ended = false;
  outroEl.classList.remove("show");
  smInit = false;
  started = true;
});

outroEl.querySelector(".again").addEventListener("click", function(ev){
  ev.stopPropagation();
  clock = 0;
  ended = false;
  smInit = false;
  outroEl.classList.remove("show");
  setPlaying(true);
  started = true;
});

function showOutro(){
  setPlaying(false);
  outroEl.classList.add("show");
  chapEl.style.opacity = "0";
}

/* 闲置隐光标 */
var audioStartedAt = -1e9;
window.addEventListener("pointerdown", function(ev){
  /* 点声音图标本身不要顺手把声音开出来 */
  if(sndEl && (ev.target === sndEl || sndEl.contains(ev.target))) return;
  if(!isAudioOn()){ startAudio(); audioStartedAt = performance.now(); }
}, { passive:true, capture:true });
window.addEventListener("keydown", function(){
  if(!AU.on){ startAudio(); audioStartedAt = performance.now(); }
});

sndEl.addEventListener("click", function(ev){
  ev.stopPropagation();
  toggleAudio();
  audioStartedAt = performance.now();
});

var idleTimer = 0;
function poke(){
  document.body.classList.remove("hidecursor");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){
    if(started && !ended) document.body.classList.add("hidecursor");
  }, 2600);
}
window.addEventListener("pointermove", poke, { passive:true });

/* ---------------- 启动 ---------------- */
window.addEventListener("resize", resize, { passive:true });
resize();

if(reduce){
  setPlaying(false);
}

if(shotMode){
  started = true;
  bootEl.classList.add("gone");
  bootEl.style.display = "none";
  hud.classList.add("on");
  numEl.style.opacity = "1";
  chapEl.style.transition = "none";
  chapEl.style.opacity = "1";
  /* 立即跑一帧 */
  last = performance.now();
  frame(performance.now());
} else {
  /* 片头序列 */
  setTimeout(function(){ bootEl.classList.add("gone"); }, 120);
  setTimeout(function(){ bootEl.style.display = "none"; }, 1500);
  setTimeout(function(){ introEl.classList.add("show"); }, 700);
  setTimeout(function(){
    started = true;
    hud.classList.add("on");
    numEl.style.opacity = "1";
  }, 2900);
  setTimeout(function(){
    introEl.classList.remove("show");
    introEl.style.pointerEvents = "none";
  }, 5200);
}

raf = requestAnimationFrame(frame);

})();
